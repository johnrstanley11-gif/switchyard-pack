modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Classic Engineering pack"
description='''
Vote crates for the Classic Engineering pack: a Votifier-compatible vote listener that rewards crate keys, a crate
block that turns keys into loot from a data pack loot table, and cosmetic tokens (item skins, coloured elytra,
particle trails).
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="[${minecraft_version}]"
    ordering="NONE"
    side="BOTH"
