plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'net.mcreator'

base {
    archivesName = 'go_home_already'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            // Private testing: PORT_QUICKPLAY_SERVER=host:port joins that (private test) server directly.
            if (System.getenv('PORT_QUICKPLAY_SERVER')) {
                programArguments.addAll '--quickPlayMultiplayer', System.getenv('PORT_QUICKPLAY_SERVER')
            }
        }
        server {
            server()
            programArgument '--nogui'
            // Own folder so a private dev server and the dev client can run side by side.
            gameDirectory = layout.projectDirectory.dir('run-server')
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.projectDirectory.dir('run-gametest')
            systemProperty 'port.gametest', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    var props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_license: mod_license,
                 minecraft_version: minecraft_version, neo_version: neo_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '2000']
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'go_home_already'
            from components.java
        }
    }
    repositories {
        maven { name = 'Port'; url = file('../../maven').toURI() }
    }
}

// Export actual ModDev launch files for root's private packaged-jar validation.
// classpathProvider contains the late-initialized engine/dependency classpath.
tasks.register('exportPortRunClasspaths') {
    dependsOn 'prepareClientRun', 'prepareServerRun'
    doLast {
        ['client', 'server'].each { side ->
            def runTask = tasks.named('run' + side.capitalize()).get()
            def classpath = runTask.classpathProvider.files.collect { it.absolutePath }.join(File.pathSeparator)
            def output = layout.buildDirectory.file('moddev/' + side + 'RunClasspath.txt').get().asFile
            output.setText('-classpath\n"' + classpath.replace('\\', '\\\\') + '"\n', 'UTF-8')
        }
    }
}
